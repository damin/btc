services:
  - type: web
    name: btc-24h-gex-dashboard
    runtime: python
    region: virginia
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 4 --timeout 60 -b 0.0.0.0:$PORT dashboard_app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: REFRESH_INTERVAL_SEC
        value: "300"
      - key: USE_DEMO
        value: "0"
      - key: EXCHANGE_SOURCE
        value: "auto"
      # 可在 Render 控制台 Environment 里添加 SOSO_API_KEY 获得最稳定的官方 ETF JSON 接口
